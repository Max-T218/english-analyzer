# Render 배포 설정 (Blueprint). Render가 이 파일을 읽어 자동으로 웹 서비스를 만듭니다.
services:
  - type: web
    name: eng-passage-analyzer
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Render 프록시는 응답이 없는 요청을 100초 안팎에서 끊고 JSON 대신 HTML
      # 에러 페이지를 반환한다(= 화면에 'Unexpected token <' 가 뜨던 원인).
      # 그 안에서 요청이 끝나도록 배포 환경에서만 시간 예산을 줄인다.
      # (로컬은 server.py의 넉넉한 기본값을 그대로 쓴다)
      - key: MAX_RETRY_TOTAL
        value: "25"     # 누적 재시도 대기 상한(초)
      - key: GEMINI_TIMEOUT
        value: "90"     # Gemini 호출 1회 소켓 타임아웃(초)
      - key: REFINE_BUDGET
        value: "40"     # 이 시간(초) 이후에는 품질 보정 재요청을 시작하지 않음
      # (선택) 모든 사용자 공용 키를 쓰려면 아래 주석을 풀고 값을 넣으세요.
      # 지금은 '선생님마다 본인 키 입력' 방식이라 설정하지 않습니다.
      # - key: GEMINI_API_KEY
      #   sync: false
      # 저장/불러오기(구글 로그인) 기능 — Render 대시보드의 Environment 탭에서
      # 아래 두 값을 직접 입력하세요(비밀값이라 이 파일에는 적지 않습니다).
      # GOOGLE_CLIENT_ID                  : Google Cloud OAuth 클라이언트 ID
      # GOOGLE_APPLICATION_CREDENTIALS_JSON: Firestore 서비스 계정 키 JSON 전체 내용
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
