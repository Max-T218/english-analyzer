# Render 배포 설정 (Blueprint). Render가 이 파일을 읽어 자동으로 웹 서비스를 만듭니다.
services:
  - type: web
    name: eng-passage-analyzer
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Render 프록시는 응답이 없는 요청을 100초 안팎에서 끊고 JSON 대신 HTML
      # 에러 페이지를 반환한다(= 화면에 'Unexpected token <' 가 뜨던 원인).
      # 그 안에서 요청이 끝나도록 배포 환경에서만 시간 예산을 줄인다.
      # (로컬은 server.py의 넉넉한 기본값을 그대로 쓴다)
      - key: MAX_RETRY_TOTAL
        value: "25"     # 누적 재시도 대기 상한(초)
      - key: GEMINI_TIMEOUT
        value: "90"     # Gemini 호출 1회 소켓 타임아웃(초)
      - key: REFINE_BUDGET
        value: "40"     # 이 시간(초) 이후에는 품질 보정 재요청을 시작하지 않음
      # 아래 값들은 Render 대시보드의 Environment 탭에서 직접 입력하세요
      # (비밀값이라 이 파일에는 적지 않습니다):
      # GEMINI_API_KEY                     : 관리자(운영자)의 Gemini API 키 — 모든 사용자가
      #                                       로그인 후 이 키 하나를 같이 씁니다(필수)
      # GOOGLE_CLIENT_ID                   : Google Cloud OAuth 클라이언트 ID (구글 로그인용)
      # GOOGLE_APPLICATION_CREDENTIALS_JSON: Firestore 서비스 계정 키 JSON 전체 내용 (로그인 저장용, 필수)
      # SMTP_USER / SMTP_PASSWORD          : 회원가입 인증코드를 보낼 Gmail 계정 + 앱 비밀번호
      # ADMIN_USERNAME / ADMIN_PASSWORD    : /admin.html 관리자 페이지 로그인 (회원 목록·
      #                                       토큰 조회·충전). ADMIN_PASSWORD를 안 넣으면
      #                                       관리자 페이지는 항상 로그인이 거부된다.
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
