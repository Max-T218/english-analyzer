# Render 배포 설정 (Blueprint). Render가 이 파일을 읽어 자동으로 웹 서비스를 만듭니다.
services:
  - type: web
    name: eng-passage-analyzer
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # 예전에는 프록시가 응답 없는 요청을 100초 안팎에서 끊어(화면에 'Unexpected
      # token <'가 뜨던 원인) 시간 예산을 40초까지 조여 뒀다. 2026-08-08에 배포된
      # 서버로 직접 재 보니 30·60·90·110·130·160·200초가 모두 정상 응답했고, Render
      # 문서도 요청 제한을 100분이라고 한다. 그 제약은 더 이상 없다.
      #
      # 40초에서는 보정 재요청이 1회밖에 못 들어갔다(1차 호출이 평균 36.7초, 보정
      # 1회가 약 32초). 검사가 6가지인데 첫 번째만 고치고 나머지는 그대로 나갔다.
      # 이 도구는 수업 중이 아니라 수업 자료를 미리 만드는 데 쓰므로, 기다리는
      # 시간보다 오류가 섞인 자료가 나가는 쪽이 훨씬 손해다. 그래서 시간을 내주고
      # 보정 기회를 4회로 늘린다(최대 대기 약 180초, 잰 한계 200초 안쪽).
      # 문제가 없는 지문은 검사만 통과하므로 대기 시간이 늘지 않는다.
      - key: MAX_RETRY_TOTAL
        value: "25"     # 누적 재시도 대기 상한(초) — 호출 1건마다 따로 적용된다
      - key: GEMINI_TIMEOUT
        value: "90"     # Gemini 호출 1회 소켓 타임아웃(초)
      - key: REFINE_BUDGET
        value: "150"    # 이 시간(초) 이후에는 품질 보정 재요청을 시작하지 않음
      # 아래 값들은 Render 대시보드의 Environment 탭에서 직접 입력하세요
      # (비밀값이라 이 파일에는 적지 않습니다):
      # GEMINI_API_KEY                     : 관리자(운영자)의 Gemini API 키 — 모든 사용자가
      #                                       로그인 후 이 키 하나를 같이 씁니다(필수)
      # GOOGLE_CLIENT_ID                   : Google Cloud OAuth 클라이언트 ID (구글 로그인용)
      # GOOGLE_APPLICATION_CREDENTIALS_JSON: Firestore 서비스 계정 키 JSON 전체 내용 (로그인 저장용, 필수)
      # SMTP_USER / SMTP_PASSWORD          : 회원가입 인증코드를 보낼 Gmail 계정 + 앱 비밀번호
      # ADMIN_USERNAME / ADMIN_PASSWORD    : /admin.html 관리자 페이지 로그인 (회원 목록·
      #                                       토큰 조회·충전). ADMIN_PASSWORD를 안 넣으면
      #                                       관리자 페이지는 항상 로그인이 거부된다.
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
