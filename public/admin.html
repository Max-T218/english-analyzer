<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · English Lab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- 본문 폭을 기본(900px)보다 넓게 잡는다. 회원 목록이 이메일·이름·가입일·잔액에
     충전 컨트롤과 버튼 셋까지 한 줄에 담아야 해서, 읽기용 폭으로는 가로 스크롤이
     생기고 오른쪽 끝의 '탈퇴'가 화면 밖으로 밀린다. -->
<div class="wrap" style="max-width:1180px;">

  <header class="app-head">
    <h1 class="eyebrow">English Lab · 관리자</h1>
    <p>회원 목록 · 잔액 조회 · 잔액 충전</p>
  </header>

  <!-- ══════════ 관리자 로그인 ══════════ -->
  <section class="panel" id="adminGate">
    <form class="auth-panel" id="adminLoginForm" style="max-width:320px;">
      <label for="adminUsername">아이디</label>
      <input type="text" id="adminUsername" autocomplete="username" placeholder="admin">
      <label for="adminPassword">비밀번호</label>
      <input type="password" id="adminPassword" autocomplete="current-password" placeholder="비밀번호">
      <div class="gate-actions">
        <button type="submit" class="btn" id="adminLoginBtn">로그인</button>
        <span class="gate-status" id="adminLoginStatus"></span>
      </div>
      <div class="error" id="adminLoginError"></div>
    </form>
  </section>

  <!-- ══════════ 관리자 화면 ══════════ -->
  <section id="adminWorkspace" hidden>
    <div class="panel" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <span class="hint" id="adminSummary"></span>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn ghost small" id="adminRefreshBtn">↻ 새로고침</button>
        <button type="button" class="btn ghost small" id="adminLogoutBtn">로그아웃</button>
      </div>
    </div>

    <div class="error" id="adminListError"></div>
    <!-- 가입을 시작했지만 인증을 끝내지 못한 사람들.
         회원 목록에는 안 나오므로(users 문서가 없다) 여기서만 보인다. -->
    <div class="panel" id="pendingPanel" hidden style="border-color:#d9a441; background:rgba(217,164,65,.08);">
      <b id="pendingTitle" style="font-size:13px;"></b>
      <div id="pendingList" style="margin-top:8px; font-size:12.5px; line-height:1.9;"></div>
    </div>

    <!-- 가로 스크롤이 생기면 오른쪽 끝의 '탈퇴'가 화면 밖으로 밀려 보이지 않는다.
         칸마다 폭을 지정해(table-layout:fixed) 표가 화면 폭 안에 들어오게 하고,
         길어질 수 있는 값(이메일·이름)만 넘칠 때 …로 줄인다. -->
    <div class="panel">
      <table id="userTable"
             style="width:100%; table-layout:fixed; border-collapse:collapse; font-size:13px;">
        <!-- ⚠️ <col>은 열 개수와 **정확히 같아야** 한다. table-layout:fixed에서는
             앞쪽 col들이 폭을 다 가져가고 빠진 열은 0폭이 되는데, 그러면 그 칸의
             단추가 한 글자씩 세로로 쪼개지며 줄 높이가 화면 하나만큼 늘어난다
             (실제로 그랬다 — '학생기능'을 넣으면서 col을 안 늘려 '관리'가 0폭이 됐다).
             열을 더하거나 뺄 때는 아래 col도 함께 고치고, 합이 100%인지 확인할 것. -->
        <colgroup>
          <col style="width:18%">   <!-- 이메일 -->
          <col style="width:8%">    <!-- 이름 -->
          <col style="width:5%">    <!-- 가입 -->
          <col style="width:10%">   <!-- 가입일 -->
          <col style="width:10%">   <!-- 최근 로그인 -->
          <col style="width:8%">    <!-- 잔액 -->
          <col style="width:7%">    <!-- 학생기능 -->
          <col style="width:34%">   <!-- 관리 — 칸·고르개·단추 셋이 한 줄에 들어갈 폭 -->
        </colgroup>
        <thead>
          <tr style="text-align:left; border-bottom:1px solid var(--line);">
            <th style="padding:8px 6px;">이메일</th>
            <th style="padding:8px 6px;">이름</th>
            <th style="padding:8px 6px;">가입</th>
            <th style="padding:8px 6px;">가입일</th>
            <th style="padding:8px 6px;" title="마지막으로 로그인한 날(KST). 1년 넘게 비면 이용약관 14조 6항에 따라 휴면으로 전환된다 — 전환 30일 전에 메일로 알린다">최근 로그인</th>
            <th style="padding:8px 6px; text-align:right;">잔액(원)</th>
            <th style="padding:8px 6px;" title="반/학생 등록 기능 사용 허가 — 미성년자 데이터가 걸려 있어 기본은 꺼짐">학생기능</th>
            <th style="padding:8px 6px;">관리</th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
  </section>

</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

async function postJson(url, payload) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(payload || {}),
  });
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch {}
  if (!data) throw new Error(`서버 오류 (HTTP ${res.status})`);
  if (!res.ok) throw new Error(data.error || "요청에 실패했습니다.");
  return data;
}
async function getJson(url) {
  const res = await fetch(url);
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch {}
  if (!data) throw new Error(`서버 오류 (HTTP ${res.status})`);
  if (!res.ok) throw new Error(data.error || "요청에 실패했습니다.");
  return data;
}

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const gateEl = $("adminGate");
const workspaceEl = $("adminWorkspace");
function showGate() {
  gateEl.hidden = false;
  workspaceEl.hidden = true;
}
function showWorkspace() {
  gateEl.hidden = true;
  workspaceEl.hidden = false;
  loadUsers();
}

// 이미 로그인된 세션이면(관리자 세션 쿠키) 다시 로그인하지 않고 바로 들여보낸다
(async () => {
  try {
    const info = await getJson("/api/admin/me");
    if (info.loggedIn) showWorkspace();
    else showGate();
  } catch (_) {
    showGate();
  }
})();

const loginBtn = $("adminLoginBtn");
const loginError = $("adminLoginError");
const loginStatus = $("adminLoginStatus");
$("adminLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = $("adminUsername").value.trim();
  const password = $("adminPassword").value;
  loginError.textContent = "";
  if (!username || !password) {
    loginError.textContent = "아이디와 비밀번호를 입력하세요.";
    return;
  }
  loginBtn.disabled = true;
  loginStatus.textContent = "확인 중…";
  try {
    await postJson("/api/admin/login", { username, password });
    $("adminPassword").value = "";
    showWorkspace();
  } catch (err) {
    loginError.textContent = err.message || "로그인에 실패했습니다.";
  } finally {
    loginBtn.disabled = false;
    loginStatus.textContent = "";
  }
});

$("adminLogoutBtn").addEventListener("click", async () => {
  try { await postJson("/api/admin/logout"); } catch (_) {}
  showGate();
});
$("adminRefreshBtn").addEventListener("click", loadUsers);

/* 이 화면으로 '돌아올 때' 다시 받아 온다.
   회원은 계속 앱을 쓰고 있어서 잔액이 실시간으로 깎이고 새로 가입도 들어오는데,
   지금까지는 처음 들어올 때와 새로고침 버튼을 누를 때만 목록을 받아 왔다.
   그래서 관리자 화면을 켜 둔 채 다른 일을 하다 돌아오면 몇 시간 전 목록을 보게 됐다.

   일정 간격으로 계속 부르지 않는 이유: 사람이 안 보고 있는 동안에도 Firestore 읽기가
   쌓인다. 보는 순간에만 새로 받으면 비용은 그대로면서 눈에 보이는 값은 늘 최신이다.
   30초 안에 두 번 돌아오는 경우까지 매번 부르지는 않는다(창을 자주 오가는 사용감). */
let lastAutoLoad = 0;
function refreshIfStale() {
  if (workspaceEl.hidden) return;              // 로그인 화면이면 부를 것이 없다
  if (document.visibilityState !== "visible") return;
  if (Date.now() - lastAutoLoad < 30000) return;
  loadUsers();
}
document.addEventListener("visibilitychange", refreshIfStale);
window.addEventListener("focus", refreshIfStale);

/* 가입일. '2026. 8. 14. 오후 02:43'은 한 줄에 20자가 넘어 표를 넓히는 주범이라
   '26.08.14 14:43'으로 줄인다 — 관리자가 보는 값이라 연도 앞 두 자리와 24시간제로
   충분하고, 폭이 절반이 된다. */
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getFullYear() % 100)}.${p(d.getMonth() + 1)}.${p(d.getDate())} `
       + `${p(d.getHours())}:${p(d.getMinutes())}`;
}

let currentUsers = [];

let lastLoadedAt = null;   // 이 목록을 언제 받아 왔는지 (화면에 그대로 적는다)

async function loadUsers() {
  const errEl = $("adminListError");
  errEl.textContent = "";
  lastAutoLoad = Date.now();   // 방금 받아 왔으니 자동 갱신은 30초 뒤부터
  try {
    const data = await getJson("/api/admin/users");
    currentUsers = data.users || [];
    lastLoadedAt = new Date();
    renderUsers();
    renderPending(data.pending || [], data.mailReady !== false);
  } catch (err) {
    // 세션이 만료됐으면 로그인 화면으로 되돌린다
    if (/로그인/.test(err.message || "")) {
      showGate();
      return;
    }
    errEl.textContent = err.message || "회원 목록을 불러오지 못했습니다.";
  }
}

// 요약줄 — 회원 수·전체 잔액과 함께 '언제 받아 온 목록인지'를 적는다.
// 이 화면은 열어 둔 채로 두면 그 시점에 멈춰 있는데, 그것을 알 방법이 없어서
// 몇 시간 전 잔액을 지금 값으로 믿게 되는 것이 문제였다.
function renderSummary() {
  const totalKrw = currentUsers.reduce((sum, u) => sum + (u.krwRemaining || 0), 0);
  const at = lastLoadedAt
    ? " · " + lastLoadedAt.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + " 기준"
    : "";
  $("adminSummary").textContent =
    `회원 ${currentUsers.length}명 · 전체 잔액 ${totalKrw.toLocaleString()}원${at}`;
}

/* 가입하다 멈춘 사람들 — 이메일 인증을 끝내지 못해 회원 문서가 없는 경우.
   메일 발송이 꺼져 있으면(mailReady=false) 그것이 원인이므로 먼저 알린다. */
function renderPending(pending, mailReady) {
  const panel = $("pendingPanel");
  if (!pending.length && mailReady) {
    panel.hidden = true;
    return;
  }
  panel.hidden = false;
  $("pendingTitle").textContent = mailReady
    ? `⏳ 가입 진행 중(인증 대기) ${pending.length}명`
    : `⚠️ 인증메일 발송이 꺼져 있습니다 — 이메일 가입이 되지 않습니다`
      + (pending.length ? ` (대기 ${pending.length}명)` : "");
  $("pendingList").innerHTML =
    (mailReady
      ? ""
      : `<div style="margin-bottom:8px;">서버에 SMTP_USER·SMTP_PASSWORD가 없어 인증코드를 보낼 수 없습니다.
         이 상태에서는 이메일로 가입할 수 없고, 구글 로그인만 됩니다.</div>`) +
    (pending.length
      ? pending.map((p) => `<div>${esc(p.email)}${p.name ? " (" + esc(p.name) + ")" : ""}
           <span style="color:var(--ink-soft);">· ${esc(fmtDate(p.createdAt))} 시작</span></div>`).join("")
      : "");
}

/* 최근 로그인 칸. 휴면이면 그 사실을, 전환 예정이면 예정일을 함께 보여 준다 —
   "왜 휴면이냐"는 문의가 왔을 때 관리자가 확인할 자리가 여기뿐이다.
   비어 있는 계정은 이 기능 이전에 가입해 아직 다시 로그인하지 않은 사람이고,
   서버도 그런 계정은 휴면 판정에서 제외한다(sweep_dormant_accounts). */
function dormancyCell(u) {
  const when = u.lastLogin ? esc(u.lastLogin) : "<span style=\"opacity:.5\">기록 없음</span>";
  if (u.dormant) return `${when} <b style="color:var(--g)">· 휴면</b>`;
  if (u.dormantDue) return `${when} <span title="휴면 전환 예정일">· ${esc(u.dormantDue)} 예정</span>`;
  return when;
}

function renderUsers() {
  renderSummary();

  $("userTableBody").innerHTML = currentUsers.map((u) => `
    <tr style="border-bottom:1px solid var(--line-soft);" data-uid="${esc(u.id)}">
      <td style="padding:8px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
          title="${esc(u.email)}">${esc(u.email)}</td>
      <td style="padding:8px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
          title="${esc(u.name)}">${esc(u.name)}</td>
      <td style="padding:8px 6px; white-space:nowrap;">${u.provider === "google" ? "구글" : "이메일"}</td>
      <td style="padding:8px 6px; white-space:nowrap; color:var(--ink-soft); font-size:12px;">${esc(fmtDate(u.createdAt))}</td>
      <td style="padding:8px 6px; white-space:nowrap; color:var(--ink-soft); font-size:12px;">${dormancyCell(u)}</td>
      <td style="padding:8px 6px; text-align:right; font-weight:700; white-space:nowrap;" class="cell-krw">${u.krwRemaining.toLocaleString()}원</td>
      <td style="padding:8px 6px;">
        <button type="button" class="btn ${u.classroomApproved ? "" : "ghost"} small classroom-btn"
                style="padding:4px 7px; font-size:11.5px;"
                title="반/학생 등록 기능을 이 선생님에게 허용할지">
          ${u.classroomApproved ? "허용됨" : "미허용"}
        </button>
      </td>
      <td style="padding:8px 6px;">
        <!-- flex-wrap: 창이 좁아지면 넘치는 대신 아래로 접히게 한다. 넘치면 오른쪽 끝의
             '탈퇴'가 화면 밖으로 밀려 아예 보이지 않는다. -->
        <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
          <input type="number" class="recharge-input" placeholder="±원"
                 style="width:64px; padding:4px 6px; font-size:12px;">
          <!-- 유상(돈을 받고 넣어 준 것)인지 무상 지급인지 구분해 둔다.
               유상분만 환불 대상이라, 나중에 환불 요청이 오면 이 구분이 근거가 된다.
               글자를 줄인 것은 폭 때문이다 — 뜻은 title로 남긴다. -->
          <select class="recharge-kind" title="무상 지급 / 유상 충전(입금 확인)"
                  style="padding:4px 2px; font-size:12px; width:54px;">
            <option value="grant">무상</option>
            <option value="charge">유상</option>
          </select>
          <button type="button" class="btn ghost small recharge-btn" style="padding:4px 7px;">충전</button>
          <button type="button" class="btn ghost small usage-btn" style="padding:4px 7px;">내역</button>
          <!-- 되돌릴 수 없는 작업이라 다른 버튼과 눈에 띄게 구분해 둔다.
               실수로 옆 버튼을 누르는 일이 없도록 간격도 벌린다. -->
          <button type="button" class="btn ghost small danger delete-btn"
                  style="padding:4px 7px; margin-left:6px;">탈퇴</button>
        </div>
      </td>
    </tr>
  `).join("") || `<tr><td colspan="8" style="padding:16px 6px; color:var(--ink-soft);">회원이 없습니다.</td></tr>`;
}

/* 회원 강제 탈퇴 — 되돌릴 수 없다. 계정·저장 자료·이용 내역·잔액이 함께 사라지고,
   그 이메일은 재가입해도 시작 잔액을 다시 받지 못한다(deleted_accounts에 남는다).

   확인을 두 단계로 둔 이유: 목록의 줄이 촘촘해 옆 회원을 누르기 쉽고, 한 번 지우면
   되돌릴 방법이 없다. 그래서 무엇이 사라지는지 먼저 보여 주고, 이메일을 직접 입력해
   대상을 확인하게 한다. 서버도 같은 이메일을 다시 받아 대조한다 — 화면 목록이 낡아
   있으면 같은 자리에 다른 사람이 있을 수 있기 때문이다. */
async function forceDelete(row) {
  const uid = row.dataset.uid;
  const user = currentUsers.find((x) => x.id === uid);
  if (!user) return;

  const balance = Number(user.krwRemaining || 0).toLocaleString();
  if (!confirm(
      `${user.email} 회원을 강제 탈퇴시킵니다.\n\n` +
      `함께 사라지는 것\n` +
      `· 저장한 지문과 제작 자료 전부\n` +
      `· 이용 내역 전부\n` +
      `· 남은 잔액 ${balance}원\n\n` +
      `이 이메일은 다시 가입해도 시작 잔액을 받지 못합니다.\n` +
      `되돌릴 수 없습니다. 계속할까요?`)) {
    return;
  }
  const typed = prompt(`확인을 위해 이메일을 그대로 입력하세요.\n\n${user.email}`);
  if (typed === null) return;
  if (typed.trim().toLowerCase() !== String(user.email).trim().toLowerCase()) {
    alert("이메일이 일치하지 않아 취소했습니다.");
    return;
  }

  const btn = row.querySelector(".delete-btn");
  btn.disabled = true;
  btn.textContent = "처리 중…";
  try {
    await postJson("/api/admin/delete-user", { userId: uid, email: user.email });
    alert(`${user.email} 회원을 탈퇴 처리했습니다.`);
    loadUsers();
  } catch (err) {
    alert(err.message || "탈퇴 처리에 실패했습니다.");
    btn.disabled = false;
    btn.textContent = "탈퇴";
  }
}

// 회원별 이용 내역 — 문의가 들어왔을 때 무엇에 얼마가 나갔는지 확인하는 용도.
// 목록 아래에 펼쳐 보여 준다(같은 버튼을 다시 누르면 접힘).
const USAGE_KIND_LABEL = { use: "사용", charge: "충전", grant: "지급", carry: "이월", adjust: "조정" };

async function toggleUsage(row, uid) {
  const open = row.nextElementSibling && row.nextElementSibling.classList.contains("usage-row");
  if (open) {
    row.nextElementSibling.remove();
    return;
  }
  const tr = document.createElement("tr");
  tr.className = "usage-row";
  tr.innerHTML = `<td colspan="7" style="padding:8px 12px; background:var(--bg-soft, #fafafa); font-size:12.5px;">불러오는 중…</td>`;
  row.after(tr);
  try {
    const data = await getJson("/api/admin/usage?userId=" + encodeURIComponent(uid));
    const items = data.items || [];
    tr.firstElementChild.innerHTML = items.length
      ? items.map((r) => {
          const amt = Number(r.amount) || 0;
          const sign = amt > 0 ? "+" : amt < 0 ? "−" : "";
          const money = r.kind === "carry" ? "" : `${sign}${Math.abs(amt).toLocaleString()}원`;
          return `<div style="display:flex; gap:10px; padding:3px 0; border-bottom:1px solid var(--line-soft);">
            <span style="width:44px; color:var(--ink-soft);">${esc(USAGE_KIND_LABEL[r.kind] || r.kind || "")}</span>
            <span style="width:120px; color:var(--ink-soft);">${esc(r.date || "")}</span>
            <span style="flex:1;">${esc(r.label || "")}</span>
            <span style="width:90px; text-align:right; font-weight:700;">${esc(money)}</span>
            <span style="width:110px; text-align:right; color:var(--ink-soft);">잔액 ${Number(r.balanceAfter || 0).toLocaleString()}원</span>
          </div>`;
        }).join("") + (data.more ? `<div style="padding:6px 0; color:var(--ink-soft);">최근 ${items.length}건만 표시했습니다.</div>` : "")
      : "이용 내역이 없습니다.";
  } catch (err) {
    tr.firstElementChild.textContent = err.message || "이용 내역을 불러오지 못했습니다.";
  }
}

$("userTableBody").addEventListener("click", async (e) => {
  const classroomBtn = e.target.closest(".classroom-btn");
  if (classroomBtn) {
    const row = classroomBtn.closest("tr");
    const uid = row.dataset.uid;
    const u = currentUsers.find((x) => x.id === uid);
    if (!u) return;
    const next = !u.classroomApproved;
    if (next && !confirm(
        `${u.email} 선생님에게 반/학생 등록 기능을 허용합니다.\n\n` +
        `학생 이름 등 미성년자일 수 있는 개인정보를 다루게 되니, 이 선생님이 ` +
        `보호자 동의 등 필요한 확인을 마쳤는지 확인한 뒤에 허용하세요.\n\n` +
        `계속할까요?`)) {
      return;
    }
    classroomBtn.disabled = true;
    try {
      await postJson("/api/admin/approve-classroom", { userId: uid, approved: next });
      u.classroomApproved = next;
      renderUsers();
    } catch (err) {
      alert(err.message || "처리에 실패했습니다.");
    } finally {
      classroomBtn.disabled = false;
    }
    return;
  }
  const usageBtn = e.target.closest(".usage-btn");
  if (usageBtn) {
    const row = usageBtn.closest("tr");
    toggleUsage(row, row.dataset.uid);
    return;
  }
  const delBtn = e.target.closest(".delete-btn");
  if (delBtn) {
    forceDelete(delBtn.closest("tr"));
    return;
  }
  const btn = e.target.closest(".recharge-btn");
  if (!btn) return;
  const row = btn.closest("tr");
  const uid = row.dataset.uid;
  const input = row.querySelector(".recharge-input");
  const amount = parseInt(input.value, 10);
  if (!amount) {
    input.focus();
    return;
  }
  btn.disabled = true;
  try {
    const kindEl = row.querySelector(".recharge-kind");
    const data = await postJson("/api/admin/recharge", {
      userId: uid, amount, kind: kindEl ? kindEl.value : "grant",
    });
    row.querySelector(".cell-krw").textContent = data.krwRemaining.toLocaleString() + "원";
    const u = currentUsers.find((x) => x.id === uid);
    if (u) u.krwRemaining = data.krwRemaining;
    input.value = "";
    renderSummary();
    // 충전한 줄은 서버가 돌려준 확정 잔액이라 맞지만, 나머지 줄은 화면을 연 시점의
    // 옛 값 그대로다. 회원들이 그 사이에 쓴 만큼 잔액이 이미 달라져 있으므로
    // 목록 전체를 다시 받아 온다 — '방금 충전했으니 이 화면은 최신'이라는 착각을 막는다.
    loadUsers();
  } catch (err) {
    alert(err.message || "충전에 실패했습니다.");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
