<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · English Lab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" style="max-width:760px;">

  <header class="app-head">
    <h1 class="eyebrow">English Lab · 관리자</h1>
    <p>회원 목록 · 잔액 조회 · 잔액 충전</p>
  </header>

  <!-- ══════════ 관리자 로그인 ══════════ -->
  <section class="panel" id="adminGate">
    <form class="auth-panel" id="adminLoginForm" style="max-width:320px;">
      <label for="adminUsername">아이디</label>
      <input type="text" id="adminUsername" autocomplete="username" placeholder="admin">
      <label for="adminPassword">비밀번호</label>
      <input type="password" id="adminPassword" autocomplete="current-password" placeholder="비밀번호">
      <div class="gate-actions">
        <button type="submit" class="btn" id="adminLoginBtn">로그인</button>
        <span class="gate-status" id="adminLoginStatus"></span>
      </div>
      <div class="error" id="adminLoginError"></div>
    </form>
  </section>

  <!-- ══════════ 관리자 화면 ══════════ -->
  <section id="adminWorkspace" hidden>
    <div class="panel" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <span class="hint" id="adminSummary"></span>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn ghost small" id="adminRefreshBtn">↻ 새로고침</button>
        <button type="button" class="btn ghost small" id="adminLogoutBtn">로그아웃</button>
      </div>
    </div>

    <div class="error" id="adminListError"></div>

    <div class="panel" style="overflow-x:auto;">
      <table id="userTable" style="width:100%; border-collapse:collapse; font-size:13.5px;">
        <thead>
          <tr style="text-align:left; border-bottom:1px solid var(--line);">
            <th style="padding:8px 6px;">이메일</th>
            <th style="padding:8px 6px;">이름</th>
            <th style="padding:8px 6px;">가입방식</th>
            <th style="padding:8px 6px;">가입일</th>
            <th style="padding:8px 6px; text-align:right;">잔액(원)</th>
            <th style="padding:8px 6px;">잔액 충전</th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
  </section>

</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

async function postJson(url, payload) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(payload || {}),
  });
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch {}
  if (!data) throw new Error(`서버 오류 (HTTP ${res.status})`);
  if (!res.ok) throw new Error(data.error || "요청에 실패했습니다.");
  return data;
}
async function getJson(url) {
  const res = await fetch(url);
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch {}
  if (!data) throw new Error(`서버 오류 (HTTP ${res.status})`);
  if (!res.ok) throw new Error(data.error || "요청에 실패했습니다.");
  return data;
}

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const gateEl = $("adminGate");
const workspaceEl = $("adminWorkspace");
function showGate() {
  gateEl.hidden = false;
  workspaceEl.hidden = true;
}
function showWorkspace() {
  gateEl.hidden = true;
  workspaceEl.hidden = false;
  loadUsers();
}

// 이미 로그인된 세션이면(관리자 세션 쿠키) 다시 로그인하지 않고 바로 들여보낸다
(async () => {
  try {
    const info = await getJson("/api/admin/me");
    if (info.loggedIn) showWorkspace();
    else showGate();
  } catch (_) {
    showGate();
  }
})();

const loginBtn = $("adminLoginBtn");
const loginError = $("adminLoginError");
const loginStatus = $("adminLoginStatus");
$("adminLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = $("adminUsername").value.trim();
  const password = $("adminPassword").value;
  loginError.textContent = "";
  if (!username || !password) {
    loginError.textContent = "아이디와 비밀번호를 입력하세요.";
    return;
  }
  loginBtn.disabled = true;
  loginStatus.textContent = "확인 중…";
  try {
    await postJson("/api/admin/login", { username, password });
    $("adminPassword").value = "";
    showWorkspace();
  } catch (err) {
    loginError.textContent = err.message || "로그인에 실패했습니다.";
  } finally {
    loginBtn.disabled = false;
    loginStatus.textContent = "";
  }
});

$("adminLogoutBtn").addEventListener("click", async () => {
  try { await postJson("/api/admin/logout"); } catch (_) {}
  showGate();
});
$("adminRefreshBtn").addEventListener("click", loadUsers);

/* 이 화면으로 '돌아올 때' 다시 받아 온다.
   회원은 계속 앱을 쓰고 있어서 잔액이 실시간으로 깎이고 새로 가입도 들어오는데,
   지금까지는 처음 들어올 때와 새로고침 버튼을 누를 때만 목록을 받아 왔다.
   그래서 관리자 화면을 켜 둔 채 다른 일을 하다 돌아오면 몇 시간 전 목록을 보게 됐다.

   일정 간격으로 계속 부르지 않는 이유: 사람이 안 보고 있는 동안에도 Firestore 읽기가
   쌓인다. 보는 순간에만 새로 받으면 비용은 그대로면서 눈에 보이는 값은 늘 최신이다.
   30초 안에 두 번 돌아오는 경우까지 매번 부르지는 않는다(창을 자주 오가는 사용감). */
let lastAutoLoad = 0;
function refreshIfStale() {
  if (workspaceEl.hidden) return;              // 로그인 화면이면 부를 것이 없다
  if (document.visibilityState !== "visible") return;
  if (Date.now() - lastAutoLoad < 30000) return;
  loadUsers();
}
document.addEventListener("visibilitychange", refreshIfStale);
window.addEventListener("focus", refreshIfStale);

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("ko-KR") + " " + d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
}

let currentUsers = [];

let lastLoadedAt = null;   // 이 목록을 언제 받아 왔는지 (화면에 그대로 적는다)

async function loadUsers() {
  const errEl = $("adminListError");
  errEl.textContent = "";
  lastAutoLoad = Date.now();   // 방금 받아 왔으니 자동 갱신은 30초 뒤부터
  try {
    const data = await getJson("/api/admin/users");
    currentUsers = data.users || [];
    lastLoadedAt = new Date();
    renderUsers();
  } catch (err) {
    // 세션이 만료됐으면 로그인 화면으로 되돌린다
    if (/로그인/.test(err.message || "")) {
      showGate();
      return;
    }
    errEl.textContent = err.message || "회원 목록을 불러오지 못했습니다.";
  }
}

// 요약줄 — 회원 수·전체 잔액과 함께 '언제 받아 온 목록인지'를 적는다.
// 이 화면은 열어 둔 채로 두면 그 시점에 멈춰 있는데, 그것을 알 방법이 없어서
// 몇 시간 전 잔액을 지금 값으로 믿게 되는 것이 문제였다.
function renderSummary() {
  const totalKrw = currentUsers.reduce((sum, u) => sum + (u.krwRemaining || 0), 0);
  const at = lastLoadedAt
    ? " · " + lastLoadedAt.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + " 기준"
    : "";
  $("adminSummary").textContent =
    `회원 ${currentUsers.length}명 · 전체 잔액 ${totalKrw.toLocaleString()}원${at}`;
}

function renderUsers() {
  renderSummary();

  $("userTableBody").innerHTML = currentUsers.map((u) => `
    <tr style="border-bottom:1px solid var(--line-soft);" data-uid="${esc(u.id)}">
      <td style="padding:8px 6px;">${esc(u.email)}</td>
      <td style="padding:8px 6px;">${esc(u.name)}</td>
      <td style="padding:8px 6px;">${u.provider === "google" ? "구글" : "이메일"}</td>
      <td style="padding:8px 6px; white-space:nowrap; color:var(--ink-soft); font-size:12px;">${esc(fmtDate(u.createdAt))}</td>
      <td style="padding:8px 6px; text-align:right; font-weight:700;" class="cell-krw">${u.krwRemaining.toLocaleString()}원</td>
      <td style="padding:8px 6px;">
        <div style="display:flex; gap:6px; align-items:center;">
          <input type="number" class="recharge-input" placeholder="±원" style="width:100px; padding:6px 8px; font-size:12.5px;">
          <!-- 유상(돈을 받고 넣어 준 것)인지 무상 지급인지 구분해 둔다.
               유상분만 환불 대상이라, 나중에 환불 요청이 오면 이 구분이 근거가 된다. -->
          <select class="recharge-kind" style="padding:6px 8px; font-size:12.5px;">
            <option value="grant">무상 지급</option>
            <option value="charge">유상 충전(입금 확인)</option>
          </select>
          <button type="button" class="btn ghost small recharge-btn">충전</button>
          <button type="button" class="btn ghost small usage-btn">내역</button>
        </div>
      </td>
    </tr>
  `).join("") || `<tr><td colspan="6" style="padding:16px 6px; color:var(--ink-soft);">회원이 없습니다.</td></tr>`;
}

// 회원별 이용 내역 — 문의가 들어왔을 때 무엇에 얼마가 나갔는지 확인하는 용도.
// 목록 아래에 펼쳐 보여 준다(같은 버튼을 다시 누르면 접힘).
const USAGE_KIND_LABEL = { use: "사용", charge: "충전", grant: "지급", carry: "이월", adjust: "조정" };

async function toggleUsage(row, uid) {
  const open = row.nextElementSibling && row.nextElementSibling.classList.contains("usage-row");
  if (open) {
    row.nextElementSibling.remove();
    return;
  }
  const tr = document.createElement("tr");
  tr.className = "usage-row";
  tr.innerHTML = `<td colspan="6" style="padding:8px 12px; background:var(--bg-soft, #fafafa); font-size:12.5px;">불러오는 중…</td>`;
  row.after(tr);
  try {
    const data = await getJson("/api/admin/usage?userId=" + encodeURIComponent(uid));
    const items = data.items || [];
    tr.firstElementChild.innerHTML = items.length
      ? items.map((r) => {
          const amt = Number(r.amount) || 0;
          const sign = amt > 0 ? "+" : amt < 0 ? "−" : "";
          const money = r.kind === "carry" ? "" : `${sign}${Math.abs(amt).toLocaleString()}원`;
          return `<div style="display:flex; gap:10px; padding:3px 0; border-bottom:1px solid var(--line-soft);">
            <span style="width:44px; color:var(--ink-soft);">${esc(USAGE_KIND_LABEL[r.kind] || r.kind || "")}</span>
            <span style="width:120px; color:var(--ink-soft);">${esc(r.date || "")}</span>
            <span style="flex:1;">${esc(r.label || "")}</span>
            <span style="width:90px; text-align:right; font-weight:700;">${esc(money)}</span>
            <span style="width:110px; text-align:right; color:var(--ink-soft);">잔액 ${Number(r.balanceAfter || 0).toLocaleString()}원</span>
          </div>`;
        }).join("") + (data.more ? `<div style="padding:6px 0; color:var(--ink-soft);">최근 ${items.length}건만 표시했습니다.</div>` : "")
      : "이용 내역이 없습니다.";
  } catch (err) {
    tr.firstElementChild.textContent = err.message || "이용 내역을 불러오지 못했습니다.";
  }
}

$("userTableBody").addEventListener("click", async (e) => {
  const usageBtn = e.target.closest(".usage-btn");
  if (usageBtn) {
    const row = usageBtn.closest("tr");
    toggleUsage(row, row.dataset.uid);
    return;
  }
  const btn = e.target.closest(".recharge-btn");
  if (!btn) return;
  const row = btn.closest("tr");
  const uid = row.dataset.uid;
  const input = row.querySelector(".recharge-input");
  const amount = parseInt(input.value, 10);
  if (!amount) {
    input.focus();
    return;
  }
  btn.disabled = true;
  try {
    const kindEl = row.querySelector(".recharge-kind");
    const data = await postJson("/api/admin/recharge", {
      userId: uid, amount, kind: kindEl ? kindEl.value : "grant",
    });
    row.querySelector(".cell-krw").textContent = data.krwRemaining.toLocaleString() + "원";
    const u = currentUsers.find((x) => x.id === uid);
    if (u) u.krwRemaining = data.krwRemaining;
    input.value = "";
    renderSummary();
    // 충전한 줄은 서버가 돌려준 확정 잔액이라 맞지만, 나머지 줄은 화면을 연 시점의
    // 옛 값 그대로다. 회원들이 그 사이에 쓴 만큼 잔액이 이미 달라져 있으므로
    // 목록 전체를 다시 받아 온다 — '방금 충전했으니 이 화면은 최신'이라는 착각을 막는다.
    loadUsers();
  } catch (err) {
    alert(err.message || "충전에 실패했습니다.");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
