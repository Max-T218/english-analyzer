<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 · English Lab</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/mark.png">
<link rel="manifest" href="/student.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Lab">
<link rel="apple-touch-icon" href="/app-icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="st-page">
<div class="wrap" style="max-width:640px;">

  <header class="app-head">
    <h1 class="eyebrow">English Lab · 학생</h1>
    <p>선생님이 정해 준 아이디와 비밀번호로 로그인합니다.</p>
  </header>

  <!-- ══════════ 로그인: 아이디 + 비밀번호 ══════════ -->
  <section class="panel" id="codeGate">
    <form class="auth-panel" id="codeForm" style="max-width:320px;">
      <label for="loginIdInput">아이디</label>
      <input type="text" id="loginIdInput" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label for="loginPwInput" style="margin-top:10px;">비밀번호</label>
      <input type="password" id="loginPwInput" autocomplete="current-password">
      <div class="gate-actions">
        <button type="submit" class="btn" id="codeNextBtn">로그인</button>
        <span class="gate-status" id="codeStatus"></span>
      </div>
      <div class="error" id="codeError"></div>
    </form>
  </section>

  <!-- ══════════ 시험 목록 ══════════ -->
  <section id="listWorkspace" hidden>
    <div class="panel" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <span class="hint" id="studentGreeting"></span>
      <span style="display:inline-flex; gap:6px;">
        <button type="button" class="btn ghost small" id="openPwBtn">비밀번호 변경</button>
        <button type="button" class="btn ghost small" id="logoutBtn">로그아웃</button>
      </span>
    </div>
    <div class="error" id="listError"></div>
    <div id="testList"></div>
  </section>

  <!-- ══════════ 비밀번호 변경 ══════════ -->
  <section class="panel" id="pwWorkspace" hidden>
    <button type="button" class="btn ghost small" id="pwBackBtn">← 목록으로</button>
    <form class="auth-panel" id="pwForm" style="max-width:320px; margin-top:12px;">
      <label for="pwCurrent">현재 비밀번호</label>
      <input type="password" id="pwCurrent" autocomplete="current-password">
      <label for="pwNew" style="margin-top:10px;">새 비밀번호 (4자 이상, 영어 대소문자 구분 없음)</label>
      <input type="password" id="pwNew" autocomplete="new-password">
      <label for="pwNew2" style="margin-top:10px;">새 비밀번호 확인</label>
      <input type="password" id="pwNew2" autocomplete="new-password">
      <div class="gate-actions">
        <button type="submit" class="btn" id="pwSaveBtn">변경</button>
        <span class="gate-status" id="pwStatus"></span>
      </div>
      <div class="error" id="pwError"></div>
    </form>
    <p class="hint">바꾼 비밀번호는 선생님도 볼 수 없습니다. 잊으면 선생님께 새로 정해 달라고 하세요.</p>
  </section>

  <!-- ══════════ 단어 학습 화면 ══════════ -->
  <section class="panel" id="studyWorkspace" hidden>
    <button type="button" class="btn ghost small" id="backToListBtn3">← 목록으로</button>
    <h3 id="studyTitle" style="margin:12px 0 4px;"></h3>
    <label class="chk" style="margin:6px 0 10px; display:inline-flex; align-items:center; gap:6px;">
      <input type="checkbox" id="studyHideMeaning"> 뜻 가리고 외우기 (눌러서 확인)
    </label>
    <div class="error" id="studyError"></div>
    <div class="table-wrap">
      <table class="st-table">
        <thead><tr><th>#</th><th>단어</th><th>뜻</th></tr></thead>
        <tbody id="studyTableBody"></tbody>
      </table>
    </div>
    <div class="actions" style="margin-top:16px;">
      <button type="button" class="btn" id="studyTakeBtn">이 시험 보기</button>
    </div>
  </section>

  <!-- ══════════ 응시 화면 ══════════
       한 문항씩만 보여주고 이전 문항으로 돌아갈 수 없다 — 여러 문항을 한 화면에
       띄워두면 위로 스크롤해서 이미 나온 보기들을 서로 대조해 정답을 유추할 수
       있어서(단어 수가 적을수록 특히), 그걸 막기 위한 구조다. -->
  <section class="panel" id="takeWorkspace" hidden>
    <button type="button" class="btn ghost small" id="backToListBtn">← 목록으로</button>
    <h3 id="takeTitle" style="margin:12px 0 4px;"></h3>
    <p class="hint" id="takeHint"></p>
    <p class="hint" id="takeProgress" style="font-weight:700;"></p>
    <div class="error" id="takeError"></div>
    <div id="takeForm"></div>
    <div class="actions" style="margin-top:16px;">
      <button type="button" class="btn ghost" id="prevBtn" hidden>← 이전</button>
      <button type="button" class="btn" id="nextBtn">다음</button>
      <span class="gate-status" id="submitStatus"></span>
    </div>
  </section>

  <!-- ══════════ 문제 시험 풀기 ══════════
       단어시험과 달리 한 화면에 모든 문항을 띄운다 — 지문을 읽고 푸는 시험이라 문항을
       오가며 다시 보는 것이 자연스럽다. 쓰던 답은 이 기기에 잠시 보관해 새로고침해도 남는다. -->
  <section id="quizWorkspace" hidden>
    <div class="panel">
      <button type="button" class="btn ghost small" id="quizBackBtn">← 목록으로</button>
      <h3 id="quizTitle" style="margin:12px 0 4px;"></h3>
      <p class="hint" id="quizHint">문항을 모두 풀고 맨 아래 [제출하기]를 누르세요. 제출은 한 번만 할 수 있어요.</p>
      <div class="error" id="quizError"></div>
    </div>
    <div id="quizBody"></div>
    <div class="panel qt-submit-bar">
      <span class="hint" id="quizProgress"></span>
      <button type="button" class="btn" id="quizSubmitBtn">제출하기</button>
      <span class="gate-status" id="quizSubmitStatus"></span>
    </div>
  </section>

  <!-- ══════════ 문제 시험 결과(정답·해설) ══════════ -->
  <section id="quizResultWorkspace" hidden>
    <div class="panel" style="text-align:center;">
      <div style="font-size:15px; color:var(--ink-soft); margin-bottom:6px;" id="quizResultHeading"></div>
      <div id="quizResultScore" style="font-size:32px; font-weight:800; color:var(--accent);"></div>
      <p id="quizResultLead" class="hint" style="margin-top:8px;"></p>
      <label class="chk" style="display:inline-flex; gap:6px; margin-top:6px;">
        <input type="checkbox" id="quizWrongOnly"> 틀린 문항만 보기
      </label>
    </div>
    <div id="quizResultBody"></div>
    <div style="margin:16px 0; text-align:center;">
      <button type="button" class="btn ghost" id="quizResultBackBtn">← 목록으로</button>
    </div>
  </section>

  <!-- ══════════ 결과 화면 ══════════ -->
  <section class="panel" id="resultWorkspace" hidden style="text-align:center; padding:40px 20px;">
    <div style="font-size:15px; color:var(--ink-soft); margin-bottom:6px;" id="resultHeading">제출 완료!</div>
    <div id="resultScore" style="font-size:32px; font-weight:800; color:var(--accent);"></div>
    <p id="resultLead" style="margin-top:10px; font-size:14px;"></p>
    <div id="resultWrong" style="text-align:left; margin-top:18px;"></div>
    <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
      <button type="button" class="btn" id="retryBtn" hidden>다시 도전하기</button>
      <button type="button" class="btn ghost" id="backToListBtn2">← 목록으로</button>
    </div>
  </section>

</div>

<!-- 첫 로그인 안내창 — 선생님이 정해 준 비밀번호 그대로면 로그인 직후에 한 번 뜬다 -->
<div id="pwNudge" hidden style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;">
  <div class="panel" style="max-width:380px; width:100%; text-align:center;">
    <h3 style="margin:0 0 8px;">🔒 비밀번호를 바꾸세요.</h3>
    <p style="font-size:14px; line-height:1.6; margin:0 0 16px;">
      처음 비밀번호는 모든 친구가 똑같아서,<br>
      그대로 두면 <b>다른 친구가 내 계정으로 들어올 수 있어요.</b><br>
      <b>나만 아는 비밀번호</b>로 바꿔 주세요.
    </p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button type="button" class="btn" id="pwNudgeNowBtn">지금 바꾸기</button>
      <button type="button" class="btn ghost" id="pwNudgeLaterBtn">다음에 하기</button>
    </div>
    <p class="hint" style="margin-top:10px;">다음에 하기를 눌러도 위쪽 [비밀번호 변경]에서 언제든 바꿀 수 있어요.</p>
  </div>
</div>
<!-- 제출 확인창 — 마지막 문항을 풀면 뜬다 -->
<div id="submitConfirm" hidden style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:60; padding:16px;">
  <div class="panel" style="max-width:360px; width:100%; text-align:center;">
    <h3 style="margin:0 0 8px;">제출할까요?</h3>
    <p id="submitConfirmMsg" style="font-size:14px; line-height:1.6; margin:0 0 16px;"></p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button type="button" class="btn" id="submitConfirmYesBtn">제출하기</button>
      <button type="button" class="btn ghost" id="submitConfirmNoBtn">다시 확인하기</button>
    </div>
  </div>
</div>
<script src="/quiztest.js"></script>
<script src="/student.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});</script>
</body>
</html>
